[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codeweave-local"
version = "0.0.0"
description = "Local C++ structure index, read-only API and interactive code map"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
codeweave = "codeweave.cli:main"

[tool.setuptools.packages.find]
include = ["codeweave*"]
